# .github/workflows/ci.yml — design §5.72 (MVP-4.32 / B39, build-only reframe).
#
# Continuous-integration gate for `main`, scoped to what a HOSTED runner can do
# HONESTLY: build the project under -Werror and run the NON-privileged test
# subset (compile, the B37 insn-baseline gate via llvm-objdump, golden-stderr,
# config/CLI error-paths, catalog-stability, unit/playbook syntax). The
# privileged datapath suite (veth + XDP attach + sudo) SKIPs deterministically
# via XDPMF_CI_BUILD_ONLY=1 — its real verification lives on the local /
# self-hosted mint gate (a box with a recent kernel + passwordless sudo + an
# XDP-capable interface), where it runs green every slice.
#
# ┌─ WHY build-only (D-mvp-4.32-CI-BUILD-ONLY — REVERSES §5.63 D-mvp-4.23) ────┐
# │ §5.63 (MVP-4.23) armed XDPMF_REQUIRE_FULL_COVERAGE=1 to FORCE full coverage│
# │ on CI. That intent was UNVALIDATED and is unachievable on ubuntu-latest:   │
# │ (1) the BPF object needs a generated `include/vmlinux.h` (gitignored) —    │
# │     CI never regenerated it, so the build failed before any test ran       │
# │     (14/14 historical runs RED on `vmlinux.h file not found`); and         │
# │ (2) even with the build fixed, veth/XDP-attach on a hosted runner is       │
# │     flaky/unsupported, so a full-coverage run cannot be a reliable green.   │
# │ This file fixes (1) by regenerating vmlinux.h per-runner from the runner's  │
# │ own BTF, and resolves (2) by scoping CI to the build + non-privileged       │
# │ subset. Green now MEANS "compiles clean under -Werror + the cheap          │
# │ invariants a refactor mutates still hold" — an honest, achievable gate.    │
# └────────────────────────────────────────────────────────────────────────────┘
#
# BRANCH-PROTECTION INTENT (not configurable from a file in-tree): to make this
# check REQUIRED for merge into `main`, a repo admin enables branch protection
# on `main` and marks `build-and-test` required (Settings → Branches).

name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain. clang-19 matches the BPF target; llvm-19 provides
      # llvm-objdump-19 (the B37 insn-baseline gate's canonical insn source,
      # D-mvp-4.27-INSN-SOURCE); libbpf-dev = userspace lib; linux-tools-* =
      # bpftool (used here ONLY to regenerate vmlinux.h from the runner's BTF).
      - name: Install toolchain
        run: |
          sudo apt-get update
          # bpftool: `linux-tools-generic` installs a REAL binary under
          # /usr/lib/linux-tools-<generic-abi>/bpftool. That binary works for
          # `btf dump file /sys/kernel/btf/vmlinux` regardless of the running
          # (azure) kernel — it reads the live BTF, it does not need to match
          # uname -r. The /usr/sbin/bpftool wrapper, by contrast, is a
          # kernel-versioned DISPATCHER that needs the absent
          # linux-tools-$(uname -r) azure pkg and fails at runtime — so the
          # vmlinux.h step probes for a bpftool whose `version` SUCCEEDS,
          # skipping the wrapper and finding the real /usr/lib binary.
          # g++ brings the libstdc++ C++ stdlib headers (<cstdint> etc.) that
          # clang++-19 uses by default — without it clang++ can't find <cstdint>.
          sudo apt-get install -y \
            clang-19 llvm-19 \
            g++ \
            libbpf-dev \
            linux-tools-common linux-tools-generic \
            python3 python3-scapy \
            jq cmake make pkg-config

      # include/vmlinux.h is gitignored (kernel-version-specific, ~2MB
      # generated). Regenerate it per-runner from the runner's OWN BTF — the
      # canonical CO-RE pattern. Fail LOUD if no bpftool / no BTF (so a silent
      # build break can never recur). bpftool may live off-PATH under the
      # linux-tools versioned dir, so probe a few locations.
      - name: Generate vmlinux.h (CO-RE)
        run: |
          set -euo pipefail
          test -r /sys/kernel/btf/vmlinux || { echo "::error::runner kernel lacks /sys/kernel/btf/vmlinux (no BTF)"; exit 1; }
          # Probe for a bpftool whose `version` actually SUCCEEDS — the
          # /usr/sbin linux-tools wrapper exists but exits non-zero ("bpftool
          # not found for kernel <azure>"), so an exists-check is not enough.
          bpftool=""
          for c in /usr/lib/linux-tools-*/bpftool /usr/lib/linux-tools/*/bpftool /usr/bin/bpftool bpftool /usr/sbin/bpftool; do
            if "$c" version >/dev/null 2>&1; then bpftool="$c"; break; fi
          done
          [ -n "$bpftool" ] || { echo "::error::no WORKING bpftool on runner (the /usr/sbin wrapper needs an absent azure-kernel pkg; linux-tools-generic provides a real /usr/lib binary)"; exit 1; }
          echo "using bpftool: $bpftool"
          # Make the WORKING bpftool THE `bpftool` on PATH (dev-box convention:
          # /usr/local/bin/bpftool, ahead of the broken /usr/sbin wrapper). The
          # CMake build's `find_program(BPFTOOL_EXE NAMES bpftool)` + its
          # `bpftool gen skeleton` step (xdpfilter.skel.h) must pick this one,
          # NOT the wrapper — so the symlink lands BEFORE the Configure step.
          sudo ln -sf "$(readlink -f "$bpftool")" /usr/local/bin/bpftool
          hash -r
          sudo "$bpftool" btf dump file /sys/kernel/btf/vmlinux format c > include/vmlinux.h
          echo "generated include/vmlinux.h ($(wc -l < include/vmlinux.h) lines)"

      - name: Configure
        run: cmake -S . -B build

      # The build enforces -Werror; a warning fails here. This is the primary
      # gate — a clean compile of the whole tree (incl. the BPF object).
      - name: Build
        run: cmake --build build

      # Build-only subset (D-mvp-4.32): NO sudo, XDPMF_CI_BUILD_ONLY=1 → the
      # privileged datapath suite SKIPs (77) deterministically; the
      # non-privileged tests RUN and gate (T_BUILD, T_INSN_BASELINE_GATE,
      # T_LOADER_STDERR_GOLDEN/_SHAPE, config/CLI error-paths,
      # T_LOG_EVENT_CATALOG_STABILITY, *_UNIT/PLAYBOOK_SYNTAX). ctest treats
      # exit-77 as Skipped (SKIP_RETURN_CODE), non-zero only on a real failure.
      # Serial (no -j) avoids CPU-oversubscription flakes on the 2-vCPU runner.
      - name: Test (build-only — privileged datapath deferred to local gate)
        run: env XDPMF_CI_BUILD_ONLY=1 ctest --test-dir build --output-on-failure

# SELF-HOSTED-RUNNER ALTERNATIVE (to run the FULL suite incl. the XDP datapath):
# swap `runs-on: ubuntu-latest` for `runs-on: [self-hosted, linux, x64]` on a box
# with a recent kernel, passwordless sudo, clang-19 + libbpf + bpftool + an
# XDP-capable iface, and DROP `XDPMF_CI_BUILD_ONLY=1` from the test step (the
# datapath tests will then run instead of skip). Unvalidated here.
