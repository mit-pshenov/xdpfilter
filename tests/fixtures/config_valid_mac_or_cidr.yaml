# §6.30 — LOAD-BEARING OR-compose fixture (MVP-3.2 / §5.27).
# Single rule with BOTH `mac:` AND `src_cidr:` — OR-compose semantic
# per Q2 OR1: MAC HASH lookup short-circuits; CIDR LPM_TRIE checked
# only if MAC missed AND ethertype == 0x0800.
default_action: drop
rules:
  - id: 0
    action: pass
    match:
      mac: "AA:BB:CC:DD:EE:FF"
      src_cidr: "10.0.0.0/8"
