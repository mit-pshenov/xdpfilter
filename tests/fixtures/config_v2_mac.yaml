# config_v2_mac.yaml — §5.47 §6.63 (c): schema_version: 2 with match: {mac}.
#
# MAC is a LIVE 6th exact-HASH axis again (HG-mvp-4.7-2; PI-mvp-4.3-MAC-DEFERRED
# RETIRED per D-mvp-4.7-MAC-RETURN-SHIFT). A well-formed `mac` match-key is now
# ACCEPTED under v2 (apply exits 0, XDP attaches) — additive within schema_version
# 2. (Malformed MACs still reject with exit 9: see config_malformed_mac.yaml.)
schema_version: 2
default_action: drop
rules:
  - id: 0
    action: pass
    match:
      mac: "02:00:00:00:00:01"
