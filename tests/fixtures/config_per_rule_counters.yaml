# §6.47..§6.52 fixture. §5.43 MVP-4.3: converted MAC→src_cidr grammar (MAC
# deferred to mvp-4.5); schema_version: 2. Sparse ids 0/5/17/42 across [0,63]
# to catch off-by-one / dense-only assumptions. Per-id src_cidr ranges are
# DISJOINT /16s (no lower-id containment) so each id is matched by exactly
# one src_ip and first-match-by-id is unambiguous:
#   - id=0  : src 10.0.0.0/16    PASS   (inject 10.0.0.x)
#   - id=5  : src 10.5.0.0/16    PASS   (inject 10.5.0.x)  survives-apply canary
#   - id=17 : src 10.17.0.0/16   DROP   (inject 10.17.0.x) drop-dispatch canary
#   - id=42 : src 10.42.0.0/16   PASS   (inject 10.42.0.x) CIDR hit-bumps
# An out-of-range src (e.g. 8.8.8.8) matches nothing → defaults drop.
schema_version: 2
default_action: drop
rules:
  - id: 0
    action: pass
    match:
      src_cidr: "10.0.0.0/16"
  - id: 5
    action: pass
    match:
      src_cidr: "10.5.0.0/16"
  - id: 17
    action: drop
    match:
      src_cidr: "10.17.0.0/16"
  - id: 42
    action: pass
    match:
      src_cidr: "10.42.0.0/16"
