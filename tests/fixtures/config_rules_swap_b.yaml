# §6.NN+1 swap-B (MVP-3.4b cycle 2 / §5.34). §5.43 MVP-4.3: MAC→src_cidr.
# id=5 DROPS src 10.5.0.0/16 (INVERTED from A); id=17 PASSES src
# 10.17.0.0/16 (INVERTED from A). Same src universe as A; swap must commit
# atomically.
schema_version: 2
default_action: drop
rules:
  - id: 5
    action: drop
    match:
      src_cidr: "10.5.0.0/16"
  - id: 17
    action: pass
    match:
      src_cidr: "10.17.0.0/16"
