# config_mac_drop_default_pass.yaml — §5.47 MVP-4.7 IPv4-gate boundary fixture.
#
# default_action: pass; a single MAC-only DROP rule. This INVERTS the usual
# polarity so the IPv4-gate semantic (D-mvp-4.7-Q2-GATE) becomes observable:
#   - an IPv4 frame from MAC 02:00:00:00:00:01 → MAC rule fires → DROP.
#   - a NON-IPv4 frame (e.g. EtherType 0x88B5 via inject_eth.py) from the SAME
#     MAC → falls through to defaults (= pass), NOT dropped. The rule-model is
#     IPv4-gated; a MAC rule matches IPv4 frames ONLY.
# A datapath that (wrongly) applied the MAC drop rule to non-IPv4 frames would
# DROP the 0x88B5 frame → the test's STAT_DROP_DENY-delta==0 assertion trips it.
schema_version: 2
default_action: pass
rules:
  - id: 0
    action: drop
    match:
      mac: "02:00:00:00:00:01"
