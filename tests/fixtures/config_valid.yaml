# Minimal valid YAML config for §6.21 T_APPLY_VALID_CONFIG.
# Also used as the "swap-A" side of §6.23 / §6.24 atomic-swap tests.
# MAC 02:00:00:00:00:01 == MAC_GOOD in tests/lib/common.sh.
default_action: drop
rules:
  - id: 0
    action: pass
    match:
      mac: "02:00:00:00:00:01"
  - id: 1
    action: pass
    match:
      mac: "02:00:00:00:00:03"
