# §6.22 sub-case 8 (MVP-3.2 / §5.27).
# Garbage string with no '/' — validator collapses to 'missing prefix
# length' (per §5.27 §4.1 stderr message catalogue). Exit 9 with
# stderr matching 'malformed CIDR: missing prefix length'.
default_action: drop
rules:
  - id: 0
    action: pass
    match:
      src_cidr: "not-a-cidr"
